services:
  core-service:
    environment:
      CAPYIOT_DEVICE_RUNTIME_ENABLED: 'false'
      CAPYIOT_FAULT_RUNTIME_ENABLED: 'false'
      CAPYIOT_DOMAIN_RUNTIME_ENABLED: 'false'
  model-fixture:
    image: python:3.12.12-slim-bookworm
    command: ['python', '/fixture/model_fixture.py']
    volumes: ['./agent-service/tests/model_fixture.py:/fixture/model_fixture.py:ro']
    networks: [internal]
  agent-service:
    environment:
      AGENT_ALLOW_INSECURE_MODEL_ENDPOINT: 'true'
