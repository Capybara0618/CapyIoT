# Only for an explicit, isolated capyiot-ms-verify-* deployment. No real provider credentials.
services:
  model-fixture:
    image: python:3.12.12-slim-bookworm
    command: [python, /fixture/model_fixture.py]
    volumes: [./agent-service/tests/model_fixture.py:/fixture/model_fixture.py:ro]
    networks: [internal]
    mem_limit: 128m
  agent-service:
    environment:
      AGENT_ALLOW_INSECURE_MODEL_ENDPOINT: 'true'
      DEEPSEEK_BASE_URL: http://model-fixture:8099
      DEEPSEEK_MODEL: offline-fixture
