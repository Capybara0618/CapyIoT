global:
  scrape_interval: 15s
scrape_configs:
  - job_name: capyiot-java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:9090
        labels: { service: gateway }
      - targets: [device-ingestion:8081]
        labels: { service: device-ingestion }
      - targets: [device-service:8082]
        labels: { service: device-service }
      - targets: [alarm-service:8083]
        labels: { service: alarm-service }
      - targets: [workflow-service:8084]
        labels: { service: workflow-service }
