# Candidate bridge callback to the device-service NodePort, with full TLS verification.
node.data_dir = "/opt/emqx/data"
listeners.tcp.default.enable = false
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/local-tls/ca.pem"
    certfile = "/opt/emqx/etc/local-tls/server.pem"
    keyfile = "/opt/emqx/etc/local-tls/server.key"
    versions = ["tlsv1.3", "tlsv1.2"]
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}
authentication = [{
  mechanism = jwt
  use_jwks = true
  endpoint = "https://device-service:30482/.well-known/device-jwks.json"
  ssl {
    enable = true
    verify = verify_peer
    cacertfile = "/opt/emqx/etc/internal-tls/ca.pem"
    server_name_indication = "device-service"
    versions = ["tlsv1.3", "tlsv1.2"]
  }
  refresh_interval = 30
  from = password
  disconnect_after_expire = true
  verify_claims = {
    iss = "capyiot-device-service"
    aud = "capyiot-emqx"
    username = "${username}"
    clientid = "${clientid}"
  }
}]
authorization {
  no_match = deny
  deny_action = disconnect
  sources = []
  cache.enable = false
}
dashboard.listeners.http.bind = 18083
api_key.bootstrap_file = "/opt/emqx/etc/local-api-keys"
