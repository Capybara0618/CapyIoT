{{- if .Values.demo.enabled }}
{{- $dependencies := list
  (dict "name" "mysql" "port" 3306 "image" "mysql:8.4.11" "disk" "2Gi" "path" "/var/lib/mysql" "memory" "896Mi"
    "probe" (list "sh" "-ec" "MYSQL_PWD=$MYSQL_ROOT_PASSWORD mysql -uroot -h127.0.0.1 -N -e 'SELECT 1 FROM information_schema.schemata WHERE schema_name=\"workflow_db\"' | grep -q 1")
    "secrets" (list "MYSQL_ROOT_PASSWORD" "DEVICE_DB_PASSWORD" "ALARM_DB_PASSWORD" "WORKFLOW_DB_PASSWORD" "PLATFORM_DB_PASSWORD"))
  (dict "name" "redis" "port" 6379 "image" "redis:7.4.8-alpine" "disk" "1Gi" "path" "/data" "memory" "192Mi"
    "args" (list "redis-server" "--appendonly" "yes") "probe" (list "redis-cli" "ping"))
  (dict "name" "kafka" "port" 29092 "image" "apache/kafka:4.1.1" "disk" "2Gi" "path" "/data" "memory" "1024Mi"
    "probe" (list "/opt/kafka/bin/kafka-broker-api-versions.sh" "--bootstrap-server" "localhost:29092")
    "env" (dict "KAFKA_NODE_ID" "1" "KAFKA_PROCESS_ROLES" "broker,controller"
      "KAFKA_LISTENERS" "INTERNAL://:29092,CONTROLLER://:9093" "KAFKA_ADVERTISED_LISTENERS" "INTERNAL://kafka:29092"
      "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP" "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      "KAFKA_INTER_BROKER_LISTENER_NAME" "INTERNAL" "KAFKA_CONTROLLER_LISTENER_NAMES" "CONTROLLER"
      "KAFKA_CONTROLLER_QUORUM_VOTERS" "1@localhost:9093" "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR" "1"
      "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR" "1" "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR" "1"
      "KAFKA_NUM_PARTITIONS" "8" "KAFKA_AUTO_CREATE_TOPICS_ENABLE" "false" "KAFKA_LOG_RETENTION_HOURS" "24"
      "KAFKA_LOG_DIRS" "/data/logs" "CLUSTER_ID" "MkU3OEVBNTcwNTJENDM2Qk" "KAFKA_HEAP_OPTS" "-Xms256m -Xmx384m"))
  (dict "name" "emqx" "port" 1883 "image" "emqx/emqx:5.8.9" "disk" "1Gi" "path" "/opt/emqx/data" "memory" "512Mi"
    "probe" (list "/opt/emqx/bin/emqx" "ctl" "status") "secrets" (list "EMQX_NODE_COOKIE")
    "env" (dict "EMQX_NODE__NAME" "emqx@127.0.0.1" "EMQX_DASHBOARD__LISTENERS__HTTP__BIND" "0" "ERL_FLAGS" "+S 2:2"))
}}
{{- range $item := $dependencies }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $item.name }}
spec:
  selector: { app.kubernetes.io/name: {{ $item.name }} }
  ports:
    - { name: tcp, port: {{ $item.port }}, targetPort: tcp }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $item.name }}-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ $item.disk }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $item.name }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $item.name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $item.name }} }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- if eq $item.name "kafka" }}
      securityContext: { fsGroup: 1000 }
      {{- else if eq $item.name "emqx" }}
      securityContext: { fsGroup: 1000 }
      {{- end }}
      containers:
        - name: {{ $item.name }}
          image: {{ $item.image }}
          ports:
            - { name: tcp, containerPort: {{ $item.port }} }
          {{- if $item.args }}
          args: {{ $item.args | toJson }}
          {{- end }}
          env:
            - { name: TZ, value: UTC }
            {{- range $key, $value := $item.env }}
            - { name: {{ $key }}, value: {{ if eq $key "KAFKA_ADVERTISED_LISTENERS" }}{{ printf "INTERNAL://kafka.%s.svc.cluster.local:29092" $.Release.Namespace | quote }}{{ else }}{{ $value | quote }}{{ end }} }
            {{- end }}
            {{- range $item.secrets }}
            - name: {{ if eq . "EMQX_NODE_COOKIE" }}EMQX_NODE__COOKIE{{ else }}{{ . }}{{ end }}
              valueFrom:
                secretKeyRef: { name: {{ $.Values.existingSecret | quote }}, key: {{ . }} }
            {{- end }}
          resources:
            requests: { cpu: 75m, memory: 128Mi }
            limits: { cpu: "2", memory: {{ $item.memory }} }
          readinessProbe:
            exec: { command: {{ $item.probe | toJson }} }
            periodSeconds: 10
            timeoutSeconds: 8
          volumeMounts:
            - { name: data, mountPath: {{ $item.path }} }
            {{- if eq $item.name "mysql" }}
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ $item.name }}-data }
        {{- if eq $item.name "mysql" }}
        - name: init
          configMap: { name: capyiot-mysql-init, defaultMode: 493 }
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: capyiot-mysql-init
data:
  01-create-databases.sh: |
    {{- .Files.Get "files/01-create-databases.sh" | nindent 4 }}
{{- end }}
