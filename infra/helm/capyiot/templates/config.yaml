apiVersion: v1
kind: ConfigMap
metadata:
  name: capyiot-runtime
data:
  JAVA_TOOL_OPTIONS: {{ .Values.javaOptions | quote }}
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 15s
  LOGGING_PATTERN_CORRELATION: "[trace=%X{trace_id} span=%X{span_id}] "
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.endpoints.kafka | quote }}
  MQTT_URL: {{ .Values.endpoints.mqtt | quote }}
  REDIS_HOST: {{ .Values.endpoints.redis | quote }}
  CAPYIOT_DEVICE_PUBSUB_ENABLED: "true"
  CAPYIOT_KAFKA_LAG_ENABLED: "true"
  DEVICE_DB_URL: {{ printf "jdbc:mysql://%s:3306/device_db?connectionTimeZone=UTC" .Values.endpoints.mysql | quote }}
  ALARM_DB_URL: {{ printf "jdbc:mysql://%s:3306/alarm_db?connectionTimeZone=UTC" .Values.endpoints.mysql | quote }}
  WORKFLOW_DB_URL: {{ printf "jdbc:mysql://%s:3306/workflow_db?connectionTimeZone=UTC" .Values.endpoints.mysql | quote }}
  DEVICE_SERVICE_URL: http://device-service:8082
  INGESTION_SERVICE_URL: http://device-ingestion:8081
  ALARM_SERVICE_URL: http://alarm-service:8083
  WORKFLOW_SERVICE_URL: http://workflow-service:8084
  {{- if .Values.monitoring.enabled }}
  PROMETHEUS_URL: http://prometheus:9090
  {{- if .Values.monitoring.tracing }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: capyiot-nginx
data:
  default.conf: |
    server {
        listen 8080;
        server_tokens off;
        root /usr/share/nginx/html;
        index index.html;
        location /api/ {
            proxy_pass http://gateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff";
            add_header Referrer-Policy "same-origin";
        }
    }
