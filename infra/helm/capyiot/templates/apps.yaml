{{- if and .Values.keda.enabled (or (lt (int .Values.keda.minReplicas) 1) (gt (int .Values.keda.maxReplicas) 4) (gt (int .Values.keda.minReplicas) (int .Values.keda.maxReplicas)) (lt (int .Values.keda.lagThreshold) 1)) }}
{{- fail "KEDA requires 1 <= minReplicas <= maxReplicas <= 4 and a positive lagThreshold (8 partitions, 2 consumers per pod)" }}
{{- end }}
{{- $root := . }}
{{- range $name, $app := .Values.apps }}
{{- $management := $app.management | default $app.port }}
{{- $frontend := eq $name "frontend" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/part-of: capyiot, app.kubernetes.io/name: {{ $name }} }
spec:
  {{- if not (and $root.Values.keda.enabled (eq $name "device-service")) }}
  replicas: {{ $app.replicas | default 1 }}
  {{- end }}
  strategy: { type: {{ $app.strategy | default "RollingUpdate" }} }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: capyiot, app.kubernetes.io/name: {{ $name }} }
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/config.yaml") $root | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: {{ eq $name "gateway" }}
      {{- if eq $name "gateway" }}
      serviceAccountName: capyiot-observer
      {{- end }}
      terminationGracePeriodSeconds: 45
      {{- $waits := list }}
      {{- range $dependency := $app.waitFor }}
        {{- if or $root.Values.demo.enabled (not (has $dependency (list "mysql" "redis" "kafka" "emqx"))) }}
          {{- $waits = append $waits $dependency }}
        {{- end }}
      {{- end }}
      {{- if $waits }}
      initContainers:
        - name: wait-for-services
          image: busybox:1.37.0
          command: ["sh", "-ec"]
          args:
            - |
              {{- range $waits }}
              until nc -w 2 -z {{ . }} {{ get (dict "mysql" 3306 "redis" 6379 "kafka" 29092 "emqx" 1883 "gateway" 8080 "device-ingestion" 8081 "device-service" 8082 "alarm-service" 8083) . }}; do sleep 2; done
              {{- end }}
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s:%s" $app.image $root.Values.imageTag | quote }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          ports:
            - { name: http, containerPort: {{ $app.port }} }
            {{- if ne (int $management) (int $app.port) }}
            - { name: management, containerPort: {{ $management }} }
            {{- end }}
          resources:
            {{- toYaml ($app.resources | default (ternary $root.Values.resources.frontend $root.Values.resources.java $frontend)) | nindent 12 }}
          {{- if not $frontend }}
          envFrom:
            - configMapRef: { name: capyiot-runtime }
          env:
            - { name: OTEL_SERVICE_NAME, value: {{ $name }} }
            {{- range $app.secrets }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.existingSecret | quote }}, key: {{ . }} }
            {{- end }}
            {{- if eq $name "gateway" }}
            - { name: K8S_ENABLED, value: "true" }
            {{- end }}
            {{- if eq $name "device-service" }}
            - { name: CAPYIOT_QUERY_CACHE_ENABLED, value: {{ $root.Values.queryCacheEnabled | quote }} }
            - { name: CAPYIOT_JFR_OPTIONS, value: {{ $root.Values.deviceJfrOptions | quote }} }
            {{- end }}
            {{- if and (eq $name "device-service") $root.Values.demo.scenarioSecret }}
            - { name: SCENARIO_DEVICE_FILE, value: /demo/demo-devices.json }
          volumeMounts:
            - { name: scenario-credentials, mountPath: /demo, readOnly: true }
            {{- end }}
          {{- else }}
          volumeMounts:
            - { name: nginx, mountPath: /etc/nginx/conf.d, readOnly: true }
          {{- end }}
          {{- $ready := ternary "/" "/actuator/health/readiness" $frontend }}
          {{- $live := ternary "/" "/actuator/health/liveness" $frontend }}
          startupProbe:
            httpGet: { path: {{ $live }}, port: {{ $management }} }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: {{ $ready }}, port: {{ $management }} }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: {{ $live }}, port: {{ $management }} }
            periodSeconds: 15
            timeoutSeconds: 3
      {{- if $frontend }}
      volumes:
        - name: nginx
          configMap: { name: capyiot-nginx }
      {{- else if and (eq $name "device-service") $root.Values.demo.scenarioSecret }}
      volumes:
        - name: scenario-credentials
          secret: { secretName: {{ $root.Values.demo.scenarioSecret | quote }} }
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - { name: http, port: {{ $app.port }}, targetPort: http }
{{- if and $root.Values.monitoring.enabled (not $frontend) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-metrics
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - { name: metrics, port: {{ $management }}, targetPort: {{ $management }} }
{{- end }}
{{- end }}
