{{- if and .Values.keda.enabled (or (lt (int .Values.keda.minReplicas) 1) (gt (int .Values.keda.maxReplicas) 4) (gt (int .Values.keda.minReplicas) (int .Values.keda.maxReplicas)) (lt (int .Values.keda.lagThreshold) 1)) }}
{{- fail "KEDA requires 1 <= minReplicas <= maxReplicas <= 4 and a positive lagThreshold (8 partitions, 2 consumers per pod)" }}
{{- end }}
{{- $root := . }}
{{- range $name, $app := .Values.apps }}
{{- $management := $app.management | default $app.port }}
{{- $frontend := eq $name "frontend" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/part-of: capyiot, app.kubernetes.io/name: {{ $name }} }
spec:
  {{- if not (and $root.Values.keda.enabled (eq $name "device-service")) }}
  replicas: {{ $app.replicas | default 1 }}
  {{- end }}
  strategy: { type: {{ $app.strategy | default "RollingUpdate" }} }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: capyiot, app.kubernetes.io/name: {{ $name }} }
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/config.yaml") $root | sha256sum }}
    spec:
      {{- if or (eq $name "gateway") (eq $name "core-service") }}
      securityContext: { fsGroup: 1000 }
      {{- end }}
      enableServiceLinks: false
      automountServiceAccountToken: {{ eq $name "gateway" }}
      {{- if eq $name "gateway" }}
      serviceAccountName: capyiot-observer
      {{- end }}
      terminationGracePeriodSeconds: 45
      {{- $waits := list }}
      {{- range $dependency := $app.waitFor }}
        {{- if or $root.Values.demo.enabled (not (has $dependency (list "mysql" "redis" "kafka" "emqx"))) }}
          {{- $waits = append $waits $dependency }}
        {{- end }}
      {{- end }}
      {{- if $waits }}
      initContainers:
        - name: wait-for-services
          image: busybox:1.37.0
          command: ["sh", "-ec"]
          args:
            - |
              {{- range $waits }}
              until nc -w 2 -z {{ . }} {{ get (dict "mysql" 3306 "redis" 6379 "kafka" 29092 "emqx" 8883 "gateway" 8080 "device-ingestion" 8081 "device-service" 8082 "alarm-service" 8083 "core-service" 8085) . }}; do sleep 2; done
              {{- end }}
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s:%s" $app.image $root.Values.imageTag | quote }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          ports:
            - { name: http, containerPort: {{ $app.port }} }
            {{- if $frontend }}
            - { name: https, containerPort: 8443 }
            {{- end }}
            {{- if ne (int $management) (int $app.port) }}
            - { name: management, containerPort: {{ $management }} }
            {{- end }}
          resources:
            {{- toYaml ($app.resources | default (ternary $root.Values.resources.frontend $root.Values.resources.java $frontend)) | nindent 12 }}
          {{- if not $frontend }}
          envFrom:
            - configMapRef: { name: capyiot-runtime }
          {{- end }}
          env:
            {{- if not $frontend }}
            - { name: OTEL_SERVICE_NAME, value: {{ $name }} }
            {{- end }}
            {{- range $app.secrets }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.existingSecret | quote }}, key: {{ . }} }
            {{- end }}
            {{- if eq $name "gateway" }}
            - { name: K8S_ENABLED, value: "true" }
            - { name: USER_KEY_FILE, value: /keys/user-keys.json }
            - { name: USER_KEYS_GENERATE, value: "true" }
            {{- end }}
            {{- if eq $name "core-service" }}
            - { name: CAPYIOT_ASSETS_ENABLED, value: "true" }
            - { name: CAPYIOT_DEVICE_RUNTIME_ENABLED, value: "true" }
            - { name: CAPYIOT_FAULTS_ENABLED, value: "true" }
            - { name: CAPYIOT_FAULT_RUNTIME_ENABLED, value: "true" }
            - { name: CAPYIOT_WORKORDERS_ENABLED, value: "true" }
            - { name: CAPYIOT_DOMAIN_RUNTIME_ENABLED, value: "true" }
            - { name: CAPYIOT_DEVICE_KEY_FILE, value: /keys/device-keys.json }
            - { name: CAPYIOT_DEVICE_KEYS_GENERATE, value: "true" }
            {{- end }}
            {{- if has $name (list "device-service" "alarm-service" "workflow-service") }}
            - { name: SPRING_KAFKA_LISTENER_AUTO_STARTUP, value: "false" }
            - { name: CAPYIOT_OUTBOX_ENABLED, value: "false" }
            - { name: CAPYIOT_SWEEP_ENABLED, value: "false" }
            {{- end }}
            {{- if eq $name "device-service" }}
            - { name: CAPYIOT_QUERY_CACHE_ENABLED, value: {{ $root.Values.queryCacheEnabled | quote }} }
            - { name: CAPYIOT_JFR_OPTIONS, value: {{ $root.Values.deviceJfrOptions | quote }} }
            {{- end }}
            {{- if $frontend }}
            - { name: NGINX_ENVSUBST_FILTER, value: '^CORE_SERVICE_KEY$' }
            {{- end }}
          volumeMounts:
            - { name: ca-certificates, mountPath: /tls, readOnly: true }
            {{- if or (eq $name "gateway") (eq $name "core-service") }}
            - { name: signing-keys, mountPath: /keys }
            {{- end }}
            {{- if $frontend }}
            - { name: nginx, mountPath: /etc/nginx/templates, readOnly: true }
            - { name: tls-server, mountPath: /etc/nginx/local-tls, readOnly: true }
            {{- end }}
          {{- $ready := ternary "/" "/actuator/health/readiness" $frontend }}
          {{- $live := ternary "/" "/actuator/health/liveness" $frontend }}
          startupProbe:
            httpGet: { path: {{ $live }}, port: {{ $management }} }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: {{ $ready }}, port: {{ $management }} }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: {{ $live }}, port: {{ $management }} }
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: ca-certificates
          secret:
            secretName: {{ $root.Values.tlsSecret | quote }}
            items: [{ key: ca.pem, path: ca.pem }]
        {{- if $frontend }}
        - name: nginx
          configMap: { name: capyiot-nginx }
        - name: tls-server
          secret:
            secretName: {{ $root.Values.tlsSecret | quote }}
            items: [{ key: server.pem, path: server.pem }, { key: server.key, path: server.key }]
        {{- end }}
        {{- if or (eq $name "gateway") (eq $name "core-service") }}
        - name: signing-keys
          persistentVolumeClaim: { claimName: {{ ternary "gateway-signing-keys" "device-signing-keys" (eq $name "gateway") }} }
        {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - { name: http, port: {{ $app.port }}, targetPort: http }
    {{- if $frontend }}
    - { name: https, port: 8443, targetPort: https }
    {{- end }}
{{- if and $root.Values.monitoring.enabled (not $frontend) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-metrics
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - { name: metrics, port: {{ $management }}, targetPort: {{ $management }} }
{{- end }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-signing-keys
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 64Mi }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: device-signing-keys
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 64Mi }
