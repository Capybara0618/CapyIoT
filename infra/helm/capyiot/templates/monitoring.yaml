apiVersion: v1
kind: ServiceAccount
metadata:
  name: capyiot-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capyiot-observer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [gateway, device-ingestion, device-service, alarm-service, workflow-service, frontend]
    verbs: ["get"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    resourceNames: [device-service]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capyiot-observer
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: capyiot-observer }
subjects:
  - { kind: ServiceAccount, name: capyiot-observer, namespace: {{ .Release.Namespace }} }
{{- if .Values.monitoring.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: capyiot-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
    {{- range $name, $app := .Values.apps }}
    {{- if ne $name "frontend" }}
      - job_name: {{ $name }}
        metrics_path: /actuator/prometheus
        dns_sd_configs:
          - names: [{{ $name }}-metrics.{{ $.Release.Namespace }}.svc]
            type: A
            port: {{ $app.management | default $app.port }}
        relabel_configs:
          - target_label: service
            replacement: {{ $name }}
    {{- end }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: capyiot-grafana
data:
  datasources.yml: |
    {{- .Files.Get "files/datasources.yml" | nindent 4 }}
  dashboards.yml: |
    {{- .Files.Get "files/dashboards.yml" | nindent 4 }}
  capyiot.json: |
    {{- .Files.Get "files/capyiot.json" | nindent 4 }}
{{- $prom := dict "name" "prometheus" "image" .Values.monitoring.prometheusImage "ports" (list 9090) "ready" "/-/ready" }}
{{- $grafana := dict "name" "grafana" "image" .Values.monitoring.grafanaImage "ports" (list 3000) "ready" "/api/health" }}
{{- $systems := list $prom $grafana }}
{{- if .Values.monitoring.tracing }}
{{- $systems = append $systems (dict "name" "jaeger" "image" .Values.monitoring.jaegerImage "ports" (list 16686 4318) "ready" "/") }}
{{- end }}
{{- range $svc := $systems }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $svc.name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $svc.name }} }
      annotations:
        checksum/monitoring: {{ printf "%v:%v" ($.Files.Get "files/capyiot.json") ($.Values | toJson) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ $svc.name }}
          image: {{ $svc.image }}
          ports:
            {{- range $svc.ports }}
            - { containerPort: {{ . }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ $svc.ready }}, port: {{ first $svc.ports }} }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "1", memory: 384Mi }
          {{- if eq $svc.name "prometheus" }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
          {{- else if eq $svc.name "grafana" }}
          env:
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.existingSecret | quote }}, key: GRAFANA_ADMIN_PASSWORD }
          volumeMounts:
            - { name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml, readOnly: true }
            - { name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml, readOnly: true }
            - { name: config, mountPath: /etc/grafana/capyiot/capyiot.json, subPath: capyiot.json, readOnly: true }
          {{- end }}
      {{- if ne $svc.name "jaeger" }}
      volumes:
        - name: config
          configMap: { name: capyiot-{{ $svc.name }} }
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
spec:
  selector: { app.kubernetes.io/name: {{ $svc.name }} }
  ports:
    {{- range $svc.ports }}
    - { name: tcp-{{ . }}, port: {{ . }}, targetPort: {{ . }} }
    {{- end }}
{{- end }}
{{- end }}
