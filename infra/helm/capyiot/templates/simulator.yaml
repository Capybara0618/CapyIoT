{{- if and .Values.demo.scenarioSecret .Values.demo.simulatorJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: capyiot-simulator
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: simulator
          image: {{ printf "%s:%s" .Values.demo.simulatorJob.image .Values.imageTag | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --rounds
            - {{ .Values.demo.simulatorJob.rounds | quote }}
            - --interval-ms
            - {{ .Values.demo.simulatorJob.intervalMs | quote }}
          env:
            - { name: API_BASE_URL, value: "http://gateway:8080" }
            - { name: MQTT_URL, value: {{ .Values.endpoints.mqtt | quote }} }
            - { name: DEVICE_FILE, value: /demo/demo-devices.json }
          volumeMounts:
            - { name: devices, mountPath: /demo, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: devices
          secret: { secretName: {{ .Values.demo.scenarioSecret | quote }} }
{{- end }}
