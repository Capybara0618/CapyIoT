name: capyiot

x-java-build: &java-build
  context: .
  dockerfile: infra/java/Dockerfile

x-app: &app
  restart: unless-stopped
  networks: [internal]
  mem_limit: 512m

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python scripts/init_env.py}
      DEVICE_DB_PASSWORD: ${DEVICE_DB_PASSWORD:?Missing device password}
      ALARM_DB_PASSWORD: ${ALARM_DB_PASSWORD:?Missing alarm password}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?Missing workflow password}
      TZ: UTC
    ports: ['127.0.0.1:3306:3306']
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e "SELECT schema_name FROM information_schema.schemata WHERE schema_name = ''workflow_db''" | grep workflow_db']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks: [internal]

  redis:
    image: redis:7.4.8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ['127.0.0.1:9092:9092']
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [internal]

  emqx:
    image: emqx/emqx:5.8.9
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?Missing EMQX node cookie}
      EMQX_DASHBOARD__LISTENERS__HTTP__BIND: '0'
    hostname: emqx
    ports: ['127.0.0.1:1883:1883']
    volumes: [emqx-data:/opt/emqx/data]
    healthcheck:
      test: ['CMD', '/opt/emqx/bin/emqx', 'ctl', 'status']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [internal]

  device-ingestion:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: device-ingestion }
    depends_on:
      kafka: { condition: service_healthy }
      emqx: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8081/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  device-service:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: device-service }
    environment:
      DEVICE_DB_URL: jdbc:mysql://mysql:3306/device_db?connectionTimeZone=UTC
      DEVICE_DB_PASSWORD: ${DEVICE_DB_PASSWORD:?Missing device password}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8082/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  alarm-service:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: alarm-service }
    environment:
      ALARM_DB_URL: jdbc:mysql://mysql:3306/alarm_db?connectionTimeZone=UTC
      ALARM_DB_PASSWORD: ${ALARM_DB_PASSWORD:?Missing alarm password}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8083/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  workflow-service:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: workflow-service }
    environment:
      WORKFLOW_DB_URL: jdbc:mysql://mysql:3306/workflow_db?connectionTimeZone=UTC
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?Missing workflow password}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8084/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: gateway }
    environment:
      DEVICE_SERVICE_URL: http://device-service:8082
      JWT_SECRET: ${JWT_SECRET:?Missing JWT secret}
      DEMO_ADMIN_PASSWORD_HASH: ${DEMO_ADMIN_PASSWORD_HASH:?Missing demo admin hash}
      DEMO_OPERATOR_PASSWORD_HASH: ${DEMO_OPERATOR_PASSWORD_HASH:?Missing demo operator hash}
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      device-service: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9090/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    ports: ['127.0.0.1:8088:8080']
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/ >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ['127.0.0.1:9095:9090']
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana:12.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Missing Grafana password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - grafana-data:/var/lib/grafana
    networks: [internal]

networks:
  internal:

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  emqx-data:
  prometheus-data:
  grafana-data:
