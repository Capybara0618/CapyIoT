name: capyiot

x-java-build: &java-build
  context: .
  dockerfile: infra/java/Dockerfile

x-app: &app
  restart: unless-stopped
  networks: [internal]
  mem_limit: 512m
  stop_grace_period: 45s

x-observability: &observability
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 15s
  LOGGING_PATTERN_CORRELATION: "[trace=%X{trace_id} span=%X{span_id}] "

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python scripts/init_env.py}
      DEVICE_DB_PASSWORD: ${DEVICE_DB_PASSWORD:?Missing device password}
      ALARM_DB_PASSWORD: ${ALARM_DB_PASSWORD:?Missing alarm password}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?Missing workflow password}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Missing platform password}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
      TZ: UTC
    ports: ['127.0.0.1:3306:3306']
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/helm/capyiot/files/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e "SELECT schema_name FROM information_schema.schemata WHERE schema_name = ''workflow_db''" | grep workflow_db']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks: [internal]

  redis:
    image: redis:7.4.8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ['127.0.0.1:9092:9092']
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [internal]

  emqx:
    image: emqx/emqx:5.8.9
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?Missing EMQX node cookie}
    hostname: emqx
    ports: ['127.0.0.1:8883:8883']
    volumes:
      - emqx-data:/opt/emqx/data
      - ./infra/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./var/tls/ca.pem:/opt/emqx/etc/local-tls/ca.pem:ro
      - ./var/tls/server.pem:/opt/emqx/etc/local-tls/server.pem:ro
      - ./var/tls/server.key:/opt/emqx/etc/local-tls/server.key:ro
      - ./var/emqx/api-keys:/opt/emqx/etc/local-api-keys:ro
    healthcheck:
      test: ['CMD', '/opt/emqx/bin/emqx', 'ctl', 'status']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [internal]

  device-ingestion:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: device-ingestion }
    environment:
      <<: *observability
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MQTT_URL: ssl://emqx:8883
      MQTT_CA_FILE: /tls/ca.pem
      CORE_SERVICE_URL: http://core-service:8085
      CORE_SERVICE_KEY: ${CORE_SERVICE_KEY:?Missing core service key}
      DEVICE_JWT_SECRET: ${DEVICE_JWT_SECRET:?Run python scripts/init_env.py}
    volumes: [./var/tls/ca.pem:/tls/ca.pem:ro]
    depends_on:
      kafka: { condition: service_healthy }
      emqx: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8081/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  device-service:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: device-service }
    environment:
      <<: *observability
      DEVICE_DB_URL: jdbc:mysql://mysql:3306/device_db?connectionTimeZone=UTC
      DEVICE_DB_PASSWORD: ${DEVICE_DB_PASSWORD:?Missing device password}
      JWT_SECRET: ${JWT_SECRET:?Missing JWT secret}
      USER_JWKS_URI: http://gateway:8080/.well-known/jwks.json
      CORE_SERVICE_URL: http://core-service:8085
      CORE_SERVICE_KEY: ${CORE_SERVICE_KEY:?Missing core service key}
      DEVICE_JWT_SECRET: ${DEVICE_JWT_SECRET:?Run python scripts/init_env.py}
      TOPOLOGY_SYNC_TOKEN: ${TOPOLOGY_SYNC_TOKEN:?Run python scripts/init_env.py}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCENARIO_DEVICE_FILE: /demo/demo-devices.json
      CAPYIOT_LEGACY_SCENARIOS_ENABLED: 'false'
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: 'false'
      CAPYIOT_SWEEP_ENABLED: 'false'
      CAPYIOT_OUTBOX_ENABLED: 'false'
      CAPYIOT_KAFKA_LAG_ENABLED: "true"
      CAPYIOT_QUERY_CACHE_ENABLED: ${CAPYIOT_QUERY_CACHE_ENABLED:-true}
      CAPYIOT_JFR_OPTIONS: ${CAPYIOT_JFR_OPTIONS:-}
      MQTT_URL: tcp://emqx:1883
    volumes:
      - ./var:/demo:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8082/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  alarm-service:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: alarm-service }
    environment:
      <<: *observability
      ALARM_DB_URL: jdbc:mysql://mysql:3306/alarm_db?connectionTimeZone=UTC
      ALARM_DB_PASSWORD: ${ALARM_DB_PASSWORD:?Missing alarm password}
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: 'false'
      CAPYIOT_OUTBOX_ENABLED: 'false'
      JWT_SECRET: ${JWT_SECRET:?Missing JWT secret}
      USER_JWKS_URI: http://gateway:8080/.well-known/jwks.json
      CORE_SERVICE_URL: http://core-service:8085
      CORE_SERVICE_KEY: ${CORE_SERVICE_KEY:?Missing core service key}
      TOPOLOGY_SYNC_TOKEN: ${TOPOLOGY_SYNC_TOKEN:?Run python scripts/init_env.py}
      DEVICE_SERVICE_URL: http://device-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      device-service: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8083/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  workflow-service:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: workflow-service }
    environment:
      <<: *observability
      WORKFLOW_DB_URL: jdbc:mysql://mysql:3306/workflow_db?connectionTimeZone=UTC
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?Missing workflow password}
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: 'false'
      CAPYIOT_OUTBOX_ENABLED: 'false'
      JWT_SECRET: ${JWT_SECRET:?Missing JWT secret}
      USER_JWKS_URI: http://gateway:8080/.well-known/jwks.json
      CORE_SERVICE_URL: http://core-service:8085
      CORE_SERVICE_KEY: ${CORE_SERVICE_KEY:?Missing core service key}
      ALARM_SERVICE_URL: http://alarm-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      alarm-service: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8084/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  core-service:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: core-service }
    environment:
      <<: *observability
      PLATFORM_DB_URL: jdbc:mysql://mysql:3306/platform_db?connectionTimeZone=UTC
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Missing platform password}
      CORE_SERVICE_KEY: ${CORE_SERVICE_KEY:?Missing core service key}
      CAPYIOT_ASSETS_ENABLED: 'true'
      CAPYIOT_DEVICE_RUNTIME_ENABLED: 'true'
      CAPYIOT_FAULTS_ENABLED: 'true'
      CAPYIOT_FAULT_RUNTIME_ENABLED: 'true'
      CAPYIOT_AGENT_JWKS_URI: http://agent-service:8086/.well-known/agent-jwks.json
      CAPYIOT_WORKORDERS_ENABLED: 'true'
      CAPYIOT_DOMAIN_RUNTIME_ENABLED: 'true'
      ALARM_DB_URL: jdbc:mysql://mysql:3306/alarm_db?connectionTimeZone=UTC
      ALARM_DB_PASSWORD: ${ALARM_DB_PASSWORD:?Missing alarm password}
      WORKFLOW_DB_URL: jdbc:mysql://mysql:3306/workflow_db?connectionTimeZone=UTC
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?Missing workflow password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CAPYIOT_DEVICE_KEY_FILE: /keys/device-keys.json
      CAPYIOT_DEVICE_KEYS_GENERATE: 'true'
      EMQX_MANAGEMENT_URL: http://emqx:18083
      EMQX_API_KEY: ${EMQX_API_KEY:?Missing broker API key}
      EMQX_API_SECRET: ${EMQX_API_SECRET:?Missing broker API secret}
      DEVICE_DB_URL: jdbc:mysql://mysql:3306/device_db?connectionTimeZone=UTC
      DEVICE_DB_PASSWORD: ${DEVICE_DB_PASSWORD:?Missing device password}
      USER_JWKS_URI: http://gateway:8080/.well-known/jwks.json
      DEMO_ADMIN_PASSWORD_HASH: ${DEMO_ADMIN_PASSWORD_HASH:?Missing demo admin hash}
      DEMO_OPERATOR_PASSWORD_HASH: ${DEMO_OPERATOR_PASSWORD_HASH:?Missing demo operator hash}
    volumes: [device-keys:/keys]
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8085/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    <<: *app
    build:
      <<: *java-build
      args: { SERVICE: gateway }
    environment:
      <<: *observability
      PROMETHEUS_URL: http://prometheus:9090
      DEVICE_SERVICE_URL: http://device-service:8082
      INGESTION_SERVICE_URL: http://device-ingestion:8081
      ALARM_SERVICE_URL: http://alarm-service:8083
      WORKFLOW_SERVICE_URL: http://workflow-service:8084
      CORE_SERVICE_URL: http://core-service:8085
      CORE_SERVICE_KEY: ${CORE_SERVICE_KEY:?Missing core service key}
      USER_KEY_FILE: /keys/user-keys.json
      AGENT_SERVICE_URL: http://agent-service:8086
      USER_KEYS_GENERATE: 'true'
      JWT_SECRET: ${JWT_SECRET:?Missing JWT secret}
      USER_JWKS_URI: http://gateway:8080/.well-known/jwks.json
      DEMO_ADMIN_PASSWORD_HASH: ${DEMO_ADMIN_PASSWORD_HASH:?Missing demo admin hash}
      DEMO_OPERATOR_PASSWORD_HASH: ${DEMO_OPERATOR_PASSWORD_HASH:?Missing demo operator hash}
    ports: ['127.0.0.1:8080:8080']
    volumes: [gateway-keys:/keys]
    depends_on:
      core-service: { condition: service_healthy }
      device-service: { condition: service_healthy }
      alarm-service: { condition: service_healthy }
      workflow-service: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9090/actuator/health/readiness | grep UP']
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      CORE_SERVICE_KEY: ${CORE_SERVICE_KEY:?Missing core service key}
      NGINX_ENVSUBST_FILTER: '^CORE_SERVICE_KEY$'
    ports: ['127.0.0.1:8088:8080','127.0.0.1:8443:8443']
    volumes:
      - ./var/tls/server.pem:/etc/nginx/local-tls/server.pem:ro
      - ./var/tls/server.key:/etc/nginx/local-tls/server.key:ro
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  agent-service:
    profiles: [agent]
    build: ./agent-service
    environment: &agent-environment
      AGENT_DB_HOST: mysql
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
      AGENT_CORE_BASE_URL: http://core-service:8085
      AGENT_JWKS_URL: http://gateway:8080/.well-known/jwks.json
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AGENT_DISPATCH_ENABLED: 'true'
      AGENT_DELEGATION_KEY_FILE: /keys/agent-keys.json
      AGENT_DELEGATION_KEYS_GENERATE: 'true'
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-30}
      AGENT_RUN_OUTPUT_TOKEN_BUDGET: ${AGENT_RUN_OUTPUT_TOKEN_BUDGET:-8192}
    depends_on:
      mysql: { condition: service_healthy }
      core-service: { condition: service_healthy }
      gateway: { condition: service_healthy }
      agent-migrate: { condition: service_completed_successfully }
    volumes: [agent-keys:/keys]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ['CMD', '/app/.venv/bin/python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8086/health/ready",timeout=20)']
      interval: 20s
      timeout: 20s
      retries: 5
    networks: [internal]

  agent-migrate:
    profiles: [agent]
    build: ./agent-service
    environment: *agent-environment
    command: ['alembic', 'upgrade', 'head']
    depends_on:
      mysql: { condition: service_healthy }
    networks: [internal]

  simulator:
    profiles: [simulation]
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      API_BASE_URL: https://frontend:8443
      MQTT_URL: ssl://emqx:8883
      MQTT_CA_FILE: /tls/ca.pem
      DEVICE_FILE: /data/devices.json
    volumes:
      - ${VIDEO_DEVICE_FILE:-./var/video-devices.json}:/data/devices.json:ro
      - ./var/tls/ca.pem:/tls/ca.pem:ro
    depends_on:
      gateway: { condition: service_healthy }
      device-ingestion: { condition: service_healthy }
      frontend: { condition: service_healthy }
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ['127.0.0.1:9095:9090']
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana:12.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Missing Grafana password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./infra/helm/capyiot/files/datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./infra/helm/capyiot/files/dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./infra/helm/capyiot/files/capyiot.json:/etc/grafana/capyiot/capyiot.json:ro
      - grafana-data:/var/lib/grafana
    networks: [internal]

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    profiles: [monitoring]
    ports: ['127.0.0.1:16686:16686']
    networks: [internal]

networks:
  internal:

volumes:
  agent-keys:
  device-keys:
  gateway-keys:
  mysql-data:
  redis-data:
  kafka-data:
  emqx-data:
  prometheus-data:
  grafana-data:
