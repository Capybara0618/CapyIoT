name: Cloud native selected verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project agent-service --locked
      - run: npm ci
        working-directory: frontend
      - run: chmod +x backend/mvnw
      - run: >-
          uv run --project agent-service --no-sync python scripts/verify_cloud_native.py
          --groups unit manifests --bundle var/cloud-native/ci-unused
          --report-dir var/cloud-native/verification/ci
          --cluster capyiot-cn-verify --context kind-capyiot-cn-verify
          --namespace capyiot-cn-verify --infra-project capyiot-cn-infra-verify
