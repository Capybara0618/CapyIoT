name: Stage one unified verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: chmod +x backend/mvnw
      - name: Run isolated sequential verification
        run: python3 scripts/verify_stage1.py --install-browser
