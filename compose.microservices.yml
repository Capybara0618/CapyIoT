# Standalone passive candidate. Never merge with compose.yml.
name: ${MS_PROJECT:?Use an explicit candidate project}
services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
      TZ: UTC
    volumes:
    - mysql-data:/var/lib/mysql
    - ./infra/mysql/01-microservices.sh:/docker-entrypoint-initdb.d/01-microservices.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$$(cat /run/secrets/mysql-root-password)" mysql -uroot -N -e "SELECT
        COUNT(*) FROM information_schema.schemata WHERE schema_name IN ('device_db','alarm_db','workflow_db','platform_db','agent_db')"
        | grep -qx 5
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks:
    - internal
    mem_limit: 768m
    cpus: 1.0
    secrets:
    - source: mysql-root
      target: mysql-root-password
    - source: device-db
      target: device-db-password
    - source: alarm-db
      target: alarm-db-password
    - source: workflow-db
      target: workflow-db-password
    - source: platform-db
      target: platform-db-password
    - source: agent-db
      target: agent-db-password
  redis:
    image: redis:7.4.8-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - internal
    mem_limit: 128m
    cpus: 1.0
  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null
        2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
    - internal
    mem_limit: 768m
    cpus: 1.0
  emqx:
    image: emqx/emqx:5.8.9
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
    hostname: emqx
    volumes:
    - emqx-data:/opt/emqx/data
    - ./infra/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    - ./infra/emqx/start-microservices.sh:/opt/emqx/etc/start-microservices.sh:ro
    healthcheck:
      test:
      - CMD
      - /opt/emqx/bin/emqx
      - ctl
      - status
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
    - internal
    mem_limit: 512m
    cpus: 1.0
    profiles:
    - ingress
    entrypoint:
    - /bin/sh
    - /opt/emqx/etc/start-microservices.sh
    ports:
    - 127.0.0.1:${MS_MQTT_PORT:?}:8883
    secrets:
    - source: edge-ca
      target: /opt/emqx/etc/local-tls/ca.pem
    - source: edge-cert
      target: /opt/emqx/etc/local-tls/server.pem
    - source: edge-key
      target: /opt/emqx/etc/local-tls/server.key
    - source: internal-ca
      target: /opt/emqx/etc/internal-tls/ca.pem
    - source: broker-api-file
      target: /opt/emqx/etc/local-api-keys
    - source: broker-cookie
      target: emqx-node-cookie
  platform-service:
    restart: unless-stopped
    networks:
    - internal
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 45s
    security_opt:
    - no-new-privileges:true
    image: capyiot/platform-service:${MS_IMAGE_TAG:?}
    build:
      context: .
      dockerfile: infra/java/Dockerfile
      args:
        SERVICE: platform-service
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
      LOGGING_PATTERN_CORRELATION: '[trace=%X{trace_id} span=%X{span_id}] '
      SERVICE_TLS_CA_FILE: /run/secrets/internal-ca.pem
      SERVICE_TLS_ENABLED: 'true'
      SERVICE_TLS_KEYSTORE: /run/secrets/server.p12
      SERVER_SSL_ENABLED: 'true'
      SERVER_SSL_KEY_STORE: /run/secrets/server.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      USER_KEYS_GENERATE: 'false'
      PLATFORM_LEGACY_BRIDGE_ENABLED: 'false'
      DEVICE_LEGACY_BRIDGE_ENABLED: 'false'
      FAULT_LEGACY_BRIDGE_ENABLED: 'false'
      WORKFLOW_LEGACY_AUDIENCE_ENABLED: 'false'
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PLATFORM_SERVICE_URL: https://platform-service:8087
      DEVICE_SERVICE_URL: https://device-service:8082
      ALARM_SERVICE_URL: https://alarm-service:8083
      WORKFLOW_SERVICE_URL: https://workflow-service:8084
      AGENT_SERVICE_URL: https://agent-service:8086
      INGESTION_SERVICE_URL: https://device-ingestion:8081
      USER_JWKS_URI: https://gateway:8080/.well-known/jwks.json
      AGENT_JWKS_URI: https://agent-service:8086/.well-known/agent-jwks.json
      PLATFORM_SERVICE_KEY_FILE: /run/secrets/service-keys.json
      PLATFORM_DB_URL: jdbc:mysql://mysql:3306/platform_db?connectionTimeZone=UTC
      PLATFORM_DB_USER: platform_app
      CAPYIOT_DB_PASSWORD_NAME: PLATFORM_DB_PASSWORD
      CAPYIOT_FINGERPRINT_NAME: PLATFORM_COMMAND_FINGERPRINT_KEY
      PLATFORM_DOMAIN_RUNTIME_ENABLED: ${MS_WRITERS_ENABLED:-false}
      PLATFORM_BOOTSTRAP_ENABLED: ${MS_PLATFORM_BOOTSTRAP:-false}
    secrets:
    - &id001
      source: internal-ca
      target: internal-ca.pem
    - source: platform-service-tls
      target: server.p12
    - source: tls-password
      target: tls-password
    - source: platform-service-identity
      target: service-keys.json
    - source: platform-db
      target: db-password
    - source: platform-fingerprint
      target: fingerprint-key
    - source: admin-hash
      target: demo-admin-password-hash
    - source: operator-hash
      target: demo-operator-password-hash
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --show-error
      - --cacert
      - /run/secrets/internal-ca.pem
      - --max-time
      - '8'
      - https://platform-service:8087/actuator/health/readiness
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
  device-service:
