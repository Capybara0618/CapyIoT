      - /run/secrets/internal-ca.pem
      - --max-time
      - '8'
      - https://device-ingestion:8081/actuator/health/readiness
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
  agent-service:
    restart: unless-stopped
    networks:
    - internal
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 45s
    security_opt:
    - no-new-privileges:true
    image: capyiot/agent-service:${MS_IMAGE_TAG:?}
    build:
      context: ./agent-service
    environment:
      AGENT_DB_HOST: mysql
      AGENT_SERVICE_CA_FILE: /run/secrets/internal-ca.pem
      AGENT_SERVICE_KEY_FILE: /run/secrets/service-keys.json
      AGENT_JWKS_URL: https://gateway:8080/.well-known/jwks.json
      AGENT_PLATFORM_BASE_URL: https://platform-service:8087
      AGENT_DEVICE_BASE_URL: https://device-service:8082
      AGENT_FAULT_BASE_URL: https://alarm-service:8083
      AGENT_WORKFLOW_BASE_URL: https://workflow-service:8084
      AGENT_DISPATCH_ENABLED: ${MS_WRITERS_ENABLED:-false}
      AGENT_DELEGATION_KEY_FILE: /run/secrets/agent-keys.json
      AGENT_DELEGATION_KEYS_GENERATE: 'false'
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:?}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AGENT_MODEL_TIMEOUT_SECONDS: ${AGENT_MODEL_TIMEOUT_SECONDS:-30}
      AGENT_RUN_OUTPUT_TOKEN_BUDGET: ${AGENT_RUN_OUTPUT_TOKEN_BUDGET:-8192}
    command:
    - uvicorn
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8086'
    - --ssl-keyfile
    - /run/secrets/server.key
    - --ssl-certfile
    - /run/secrets/server.pem
    - --no-access-log
    - --log-level
    - info
    secrets:
    - *id001
    - source: agent-db
      target: db-password
    - source: deepseek
      target: deepseek-api-key
    - source: agent-service-identity
      target: service-keys.json
    - source: agent-delegation
      target: agent-keys.json
    - source: agent-cert
      target: server.pem
    - source: agent-key
      target: server.key
    depends_on:
      mysql:
        condition: service_healthy
      agent-migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import ssl,urllib.request; urllib.request.urlopen("https://agent-service:8086/health/ready",context=ssl.create_default_context(cafile="/run/secrets/internal-ca.pem"),timeout=15)
      interval: 20s
      timeout: 20s
      retries: 15
      start_period: 45s
  agent-migrate:
    image: capyiot/agent-service:${MS_IMAGE_TAG:?}
    build:
      context: ./agent-service
    environment:
      AGENT_DB_HOST: mysql
    secrets:
    - source: agent-db
      target: db-password
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      mysql:
        condition: service_healthy
    networks:
    - internal
    mem_limit: 256m
    restart: 'no'
  frontend:
    restart: unless-stopped
    networks:
    - internal
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 45s
    security_opt:
    - no-new-privileges:true
    profiles:
    - public
    image: capyiot/frontend:${MS_IMAGE_TAG:?}
    build:
      context: ./frontend
      args:
        NGINX_TEMPLATE: infra/nginx.microservices.conf
        VITE_PROMETHEUS_URL: http://localhost:${MS_PROMETHEUS_PORT:?}
        VITE_GRAFANA_URL: http://localhost:${MS_GRAFANA_PORT:?}/d/capyiot
        VITE_JAEGER_URL: http://localhost:${MS_JAEGER_PORT:?}
    environment:
      NGINX_ENVSUBST_FILTER: ^SESSION_PROXY_KEY$
    ports:
    - 127.0.0.1:${MS_HTTP_PORT:?}:8080
    - 127.0.0.1:${MS_HTTPS_PORT:?}:8443
    secrets:
    - source: edge-cert
      target: /etc/nginx/local-tls/server.pem
    - source: edge-key
      target: /etc/nginx/local-tls/server.key
    - source: internal-ca
      target: /etc/nginx/internal-tls/ca.pem
    - source: session-proxy
      target: session-proxy-key
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/ >/dev/null
      interval: 15s
      timeout: 5s
      retries: 10
  simulator:
    profiles:
    - simulation
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      API_BASE_URL: https://frontend:8443
      MQTT_URL: ssl://emqx:8883
      MQTT_CA_FILE: /tls/ca.pem
      DEVICE_FILE: /data/devices.json
    volumes:
    - ${MS_BUNDLE:?}/video-devices.json:/data/devices.json:ro
    - ${MS_BUNDLE:?}/pki/edge/ca.pem:/tls/ca.pem:ro
    depends_on:
      gateway:
        condition: service_healthy
      device-ingestion:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
    - internal
    mem_limit: 256m
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles:
    - monitoring
    ports:
    - 127.0.0.1:${MS_PROMETHEUS_PORT:?}:9090
    volumes:
    - ./infra/prometheus/microservices.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    networks:
    - internal
    mem_limit: 256m
    secrets:
    - source: internal-ca
      target: /etc/prometheus/internal-ca.pem
  grafana:
    image: grafana/grafana:12.3.0
    profiles:
    - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
    - 127.0.0.1:${MS_GRAFANA_PORT:?}:3000
    volumes:
    - ./infra/helm/capyiot/files/datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
    - ./infra/helm/capyiot/files/dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
    - ./infra/grafana/capyiot-microservices.json:/etc/grafana/capyiot/capyiot.json:ro
    - grafana-data:/var/lib/grafana
    networks:
    - internal
    mem_limit: 256m
    secrets:
    - source: grafana-password
      target: grafana-admin-password
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    profiles:
    - monitoring
    ports:
    - 127.0.0.1:${MS_JAEGER_PORT:?}:16686
    networks:
    - internal
    mem_limit: 256m
