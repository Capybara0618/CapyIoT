server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 5s
capyiot:
  services:
    device-url: ${DEVICE_SERVICE_URL:http://localhost:8082}
    alarm-url: ${ALARM_SERVICE_URL:http://localhost:8083}
    workflow-url: ${WORKFLOW_SERVICE_URL:http://localhost:8084}
  auth:
    jwt-secret: ${JWT_SECRET}
    campus-id: CAMPUS-A
    admin:
      username: admin
      password-hash: ${DEMO_ADMIN_PASSWORD_HASH}
    operator:
      username: operator
      password-hash: ${DEMO_OPERATOR_PASSWORD_HASH}
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
