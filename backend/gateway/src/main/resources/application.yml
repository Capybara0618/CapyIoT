server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 5s
capyiot:
  services:
    platform-url: ${PLATFORM_SERVICE_URL:https://platform-service:8087}
    agent-url: ${AGENT_SERVICE_URL:https://agent-service:8086}
    device-url: ${DEVICE_SERVICE_URL:https://device-service:8082}
    ingestion-url: ${INGESTION_SERVICE_URL:https://device-ingestion:8081}
    alarm-url: ${ALARM_SERVICE_URL:https://alarm-service:8083}
    workflow-url: ${WORKFLOW_SERVICE_URL:https://workflow-service:8084}
  auth:
    platform-ca-file: ${SERVICE_TLS_CA_FILE:/run/secrets/internal-ca.pem}
    key-file: ${USER_KEY_FILE:../var/user-keys.json}
    generate-key: ${USER_KEYS_GENERATE:false}
    session-proxy-key: ${SESSION_PROXY_KEY}
    service-key-file: ${GATEWAY_SERVICE_KEY_FILE:/run/secrets/gateway-service-keys.json}
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
