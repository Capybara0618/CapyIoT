server:
  port: 8085
  shutdown: graceful
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  task:
    scheduling:
      pool:
        size: 6
  jackson:
    parser:
      strict-duplicate-detection: true
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
  application:
    name: core-service
capyiot:
  device:
    url: ${DEVICE_SERVICE_URL:https://device-service:8082}
    tls-ca-file: ${SERVICE_TLS_CA_FILE:/run/secrets/internal-ca.pem}
  fault:
    url: ${ALARM_SERVICE_URL:https://alarm-service:8083}
    tls-ca-file: ${SERVICE_TLS_CA_FILE:/run/secrets/internal-ca.pem}
  platform:
    url: ${PLATFORM_SERVICE_URL:https://platform-service:8087}
    tls-ca-file: ${SERVICE_TLS_CA_FILE:/run/secrets/internal-ca.pem}
  foundation:
    service-key: ${CORE_SERVICE_KEY}
    jwks-uri: ${USER_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
    bootstrap:
      enabled: ${PLATFORM_BOOTSTRAP_ENABLED:true}
      admin-hash: ${DEMO_ADMIN_PASSWORD_HASH}
      operator-hash: ${DEMO_OPERATOR_PASSWORD_HASH}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
