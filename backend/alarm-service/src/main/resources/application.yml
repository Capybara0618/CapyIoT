server:
  port: ${ALARM_PORT:8083}
  shutdown: graceful
  ssl:
    enabled: ${SERVICE_TLS_ENABLED:true}
    key-store: ${SERVICE_TLS_KEYSTORE:}
    key-store-type: PKCS12
    key-store-password: ${SERVICE_TLS_KEYSTORE_PASSWORD:}
spring:
  application:
    name: alarm-service
  datasource:
    url: ${ALARM_DB_URL:jdbc:mysql://mysql:3306/alarm_db?connectionTimeZone=UTC}
    username: ${ALARM_DB_USER:alarm_app}
    password: ${ALARM_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  task:
    scheduling:
      pool:
        size: 6
  jackson:
    parser:
      strict-duplicate-detection: true
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      max-poll-records: 10
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
capyiot:
  faults:
    enabled: true
    clients:
      enabled: true
    correlation-window-seconds: 120
    health-observation-seconds: 120
    allow-historical-core: ${FAULT_ALLOW_HISTORICAL_CORE:true}
    command-fingerprint-key: ${FAULT_COMMAND_FINGERPRINT_KEY}
    service-key-file: ${FAULT_SERVICE_KEY_FILE:/run/secrets/alarm-service-keys.json}
    tls-ca-file: ${SERVICE_TLS_CA_FILE:/run/secrets/internal-ca.pem}
    platform-url: ${PLATFORM_SERVICE_URL:https://platform-service:8087}
    device-url: ${DEVICE_SERVICE_URL:https://device-service:8082}
    workflow-url: ${WORKFLOW_SERVICE_URL:https://workflow-service:8084}
    user-jwks-uri: ${USER_JWKS_URI:https://gateway:8080/.well-known/jwks.json}
    agent-jwks-uri: ${AGENT_JWKS_URI:https://agent-service:8086/.well-known/agent-jwks.json}
    workflow-jwks-uri: ${WORKFLOW_SERVICE_JWKS_URI:https://workflow-service:8084/.well-known/service-jwks.json}
    device-jwks-uri: ${DEVICE_SERVICE_JWKS_URI:https://device-service:8082/.well-known/service-jwks.json}
  domain-runtime:
    enabled: ${FAULT_DOMAIN_RUNTIME_ENABLED:false}
  fault-runtime:
    enabled: ${FAULT_RUNTIME_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
