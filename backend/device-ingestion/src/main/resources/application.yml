server:
  port: 8081
  shutdown: graceful
  ssl:
    enabled: ${SERVICE_TLS_ENABLED:true}
    key-store: ${SERVICE_TLS_KEYSTORE:}
    key-store-type: PKCS12
    key-store-password: ${SERVICE_TLS_KEYSTORE_PASSWORD:}
spring:
  application:
    name: device-ingestion
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.in.flight.requests.per.connection: 5
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,mqtt
      probes:
        enabled: true
capyiot:
  mqtt-url: ${MQTT_URL:ssl://emqx:8883}
  mqtt-client-id: ${MQTT_CLIENT_ID:capyiot-ingestion-1}
