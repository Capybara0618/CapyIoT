server:
  port: 8084
  shutdown: graceful
spring:
  application:
    name: workflow-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 12000
        request.timeout.ms: 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  task:
    scheduling:
      pool:
        size: 2
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true
  datasource:
    url: ${WORKFLOW_DB_URL:jdbc:mysql://localhost:3306/workflow_db?connectionTimeZone=UTC}
    username: ${WORKFLOW_DB_USER:workflow_app}
    password: ${WORKFLOW_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    clean-disabled: true
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
capyiot:
  user-jwt-secret: ${JWT_SECRET}
  alarm-service-url: ${ALARM_SERVICE_URL:http://localhost:8083}
springdoc:
  api-docs:
    path: /api/v1/workorders/openapi
    version: OPENAPI_3_1
  paths-to-match: /api/v1/workorders/**
