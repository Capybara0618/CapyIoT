server:
  port: ${WORKFLOW_PORT:8084}
  shutdown: graceful
  ssl:
    enabled: ${SERVICE_TLS_ENABLED:true}
    key-store: ${SERVICE_TLS_KEYSTORE:}
    key-store-type: PKCS12
    key-store-password: ${SERVICE_TLS_KEYSTORE_PASSWORD:}
spring:
  application:
    name: workflow-service
  datasource:
    url: ${WORKFLOW_DB_URL:jdbc:mysql://mysql:3306/workflow_db?connectionTimeZone=UTC}
    username: ${WORKFLOW_DB_USER:workflow_app}
    password: ${WORKFLOW_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  task:
    scheduling:
      pool:
        size: 6
  jackson:
    parser:
      strict-duplicate-detection: true
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      max-poll-records: 10
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
capyiot:
  workorders:
    enabled: true
    clients:
      enabled: true
    command-fingerprint-key: ${WORKFLOW_COMMAND_FINGERPRINT_KEY}
    service-key-file: ${WORKFLOW_SERVICE_KEY_FILE:/run/secrets/workflow-service-keys.json}
    tls-ca-file: ${SERVICE_TLS_CA_FILE:/run/secrets/internal-ca.pem}
    platform-url: ${PLATFORM_SERVICE_URL:https://platform-service:8087}
    device-url: ${DEVICE_SERVICE_URL:https://device-service:8082}
    fault-url: ${ALARM_SERVICE_URL:https://alarm-service:8083}
    user-jwks-uri: ${USER_JWKS_URI:https://gateway:8080/.well-known/jwks.json}
    agent-jwks-uri: ${AGENT_JWKS_URI:https://agent-service:8086/.well-known/agent-jwks.json}
    fault-jwks-uri: ${FAULT_SERVICE_JWKS_URI:https://alarm-service:8083/.well-known/service-jwks.json}
    device-jwks-uri: ${DEVICE_SERVICE_JWKS_URI:https://device-service:8082/.well-known/service-jwks.json}
    legacy:
      enabled: ${WORKFLOW_LEGACY_AUDIENCE_ENABLED:false}
      expires-at: ${WORKFLOW_LEGACY_AUDIENCE_EXPIRES_AT:1970-01-01T00:00:00Z}
      service-key: ${CORE_SERVICE_KEY:}
  domain-runtime:
    enabled: ${WORKFLOW_DOMAIN_RUNTIME_ENABLED:false}
  workorder-runtime:
    enabled: ${WORKFLOW_RUNTIME_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
