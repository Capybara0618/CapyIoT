[project]
name = "capyiot-agent-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0", "uvicorn>=0.34,<1", "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9", "alembic==1.20.1", "pymysql[rsa]==1.2.4",
  "httpx==0.28.1", "pyjwt[crypto]==2.15.1", "pydantic-ai-slim[openai]==2.74.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio>=1,<2", "ruff==0.17.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
